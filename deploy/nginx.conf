# Source of truth for /opt/redf-demo/nginx.conf on the `zagel` host (mounted
# as the container's default.conf). The push webhook only deploys frontend/,
# so after editing this file copy it over and reload — see ../DEPLOY.md.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  sendfile on;
  tcp_nopush on;
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 60s;

  # CSS / JS — revalidate every time (cheap 304s over HTTP/2) so deploys land
  # immediately; not every page versions its asset URLs.
  location ~* \.(?:css|js)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Images / fonts / PDFs — long cache. Optimized images get new names
  # (see deploy/perf/optimize_images.py), and ETags still catch in-place edits
  # once the entry expires.
  location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|pdf)$ {
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # HTML — always revalidate
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ $uri.html =404;
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
}
