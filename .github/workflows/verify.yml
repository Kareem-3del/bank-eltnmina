name: Verify demo deploy

# Deploy itself is handled server-side: a GitHub push webhook hits
# https://demo.kareem-3del.com/_deploy-hook and the server pulls frontend/ and
# rsyncs it live (see DEPLOY.md). We moved off the old GitHub-Actions SSH push
# because GitHub runner packets to the host's SSH port (2222) are intermittently
# dropped upstream. This workflow only *verifies* that the webhook deploy landed
# — it uses outbound HTTPS from the runner, which is reliable.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: verify-demo
  cancel-in-progress: true

jobs:
  verify:
    name: Confirm webhook deploy landed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need the parent commit to diff this push

      - name: Health check (home + EN + AR return 200)
        run: |
          set -e
          for path in / /en/index.html /ar/index.html; do
            code=""
            for attempt in $(seq 1 30); do
              code=$(curl -sSk -o /dev/null -w '%{http_code}' "https://demo.kareem-3del.com$path" || true)
              [ "$code" = "200" ] && { echo "OK    $path"; break; }
              echo "wait  $path -> $code (attempt $attempt/30)"; sleep 4
            done
            [ "$code" = "200" ] || { echo "FAIL  $path -> $code"; exit 1; }
          done

      - name: Confirm pushed content is actually live
        run: |
          set -e
          # First file changed (not deleted) under frontend/ in this push.
          file=$(git diff --name-only --diff-filter=d HEAD~1 HEAD -- 'frontend/**' | head -1 || true)
          if [ -z "$file" ]; then
            echo "no changed frontend file to fingerprint; health check is sufficient"
            exit 0
          fi
          rel=${file#frontend}
          want=$(sha256sum "$file" | awk '{print $1}')
          echo "verifying $rel == $want"
          for attempt in $(seq 1 30); do
            got=$(curl -sSk "https://demo.kareem-3del.com$rel" | sha256sum | awk '{print $1}')
            [ "$got" = "$want" ] && { echo "LIVE matches pushed content ($rel)"; exit 0; }
            echo "wait  content $rel (attempt $attempt/30): got $got"; sleep 4
          done
          echo "FAIL  $rel did not match pushed content within the timeout"
          exit 1
